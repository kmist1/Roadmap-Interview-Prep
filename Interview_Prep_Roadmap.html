<meta name="description" content="Senior iOS interview prep roadmap and daily to-do tracker.">
<meta name="theme-color" content="#0d1117">

<meta name="mobile-web-app-capable" content="yes">

<div id="app"></div>
<style>
  #app, #app * { box-sizing: border-box; font-family: 'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif; }
  #app {
    --bg: #0d1117;
    --panel: #141b24;
    --card: #1a2230;
    --card-border: #2a3444;
    --text: #e6edf3;
    --muted: #8b96a5;
    --line: #3a4556;
    --accent-dsa: #c86dd7;
    --accent-swift: #ff8a5c;
    --accent-swiftui: #4da8ff;
    --accent-arch: #38c793;
    --accent-sysdes: #ffd166;
    --accent-behav: #ff6b8a;
    --accent-mock: #9aa5ff;
    --accent-network: #14b8a6;
    --accent-uikit: #f59e0b;
    --accent-persist: #65a30d;
    --accent-concur: #8b5cf6;
    --accent-perf: #ec4899;
    --accent-lifecycle: #0ea5e9;
    --accent-security: #ef4444;
    --accent-a11y: #06b6d4;
    --accent-applebank: #a1a1aa;
    --accent-combine: #d946ef;
    --accent-deeplink: #fb923c;
    --accent-hardware: #22c55e;
    --accent-cicd: #64748b;
    --accent-blind75: #a3e635;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  /* Header + overall progress */
  .hdr { margin-bottom: 8px; }
  .hdr h1 { font-size: 23px; margin:0 0 4px; font-weight:700; letter-spacing:-0.02em; }
  .hdr .sub { color:var(--muted); font-size:13px; }
  .overall {
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--card-border);
    border-radius:14px; padding:14px 18px; margin:16px 0 2px;
  }
  .overall .bar { flex:1; height:9px; background:#0f151d; border-radius:99px; overflow:hidden; }
  .overall .bar > span { display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,#4da8ff,#38c793); transition:width .45s ease; }
  .overall .lbl { font-size:12.5px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600; }

  /* Quick-jump phase chips */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 24px; }
  .chip {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; font:inherit;
    background:var(--card); border:1px solid var(--card-border); color:var(--text);
    border-radius:99px; padding:7px 13px; font-size:12px; font-weight:600;
    transition:border-color .12s, background .12s, transform .1s;
  }
  .chip:hover { background:#1f2939; border-color:var(--line); transform:translateY(-1px); }
  .chip .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .chip .cc { color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }

  /* Data (backup) actions */
  .data-actions { display:flex; gap:8px; margin:10px 0 0; flex-wrap:wrap; align-items:center; }
  .mini-btn { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font:inherit;
    background:var(--card); border:1px solid var(--card-border); color:var(--text);
    border-radius:8px; padding:6px 11px; font-size:12px; font-weight:600;
    transition:border-color .12s, background .12s; }
  .mini-btn:hover { background:#1f2939; border-color:var(--line); }
  .data-actions .hint { color:var(--muted); font-size:11px; margin-left:2px; }

  /* Cloud sync */
  .sync-status { font-size:11px; padding:2px 9px; border-radius:99px; border:1px solid var(--card-border); color:var(--muted); white-space:nowrap; }
  .sync-status.ok { color:#38c793; border-color:#2f6f57; }
  .sync-status.syncing { color:#ffd166; border-color:#7a6a2f; }
  .sync-status.error { color:#ff6b8a; border-color:#7a3a48; }
  .sync-panel { margin:12px 0 0; padding:14px 16px; background:var(--card); border:1px solid var(--card-border); border-radius:12px; }
  .sync-panel[hidden] { display:none; }
  .sync-row { display:flex; flex-direction:column; gap:5px; margin-bottom:11px; }
  .sync-row.inline { flex-direction:row; align-items:center; gap:8px; }
  .sync-row label { font-size:11px; color:var(--muted); font-weight:600; }
  .sync-panel input { background:#0f151d; color:var(--text); border:1px solid var(--card-border);
    border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; width:100%; }
  .sync-panel input:focus { outline:none; border-color:#4da8ff; }
  .sync-row.inline input { flex:1; }
  .sync-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .sync-help { font-size:11px; color:var(--muted); line-height:1.6; margin-top:12px; }
  .sync-help code { background:#0f151d; border:1px solid var(--card-border); border-radius:4px; padding:0 4px; }
  .sync-help a { color:#4da8ff; }

  /* Phase section */
  .phase { margin-bottom:28px; scroll-margin-top:12px; }
  .phase-bar { display:flex; align-items:baseline; gap:10px; margin:0 0 8px; padding:0 2px; flex-wrap:wrap; }
  .phase-bar h2 { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; margin:0; }
  .phase-bar .wk { color:var(--muted); font-size:12px; font-weight:400; }
  .phase-bar .pc { margin-left:auto; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .phase-line { height:1px; background:var(--card-border); margin-bottom:10px; }

  /* Track — collapsible accordion */
  .track {
    background:var(--card); border:1px solid var(--card-border);
    border-left:3px solid var(--track-color, var(--line));
    border-radius:11px; margin-bottom:8px; overflow:hidden;
    transition:border-color .12s, box-shadow .15s;
  }
  .track.open { box-shadow:0 6px 22px rgba(0,0,0,.30); }
  .track-head {
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:none; color:var(--text); font:inherit;
    padding:13px 15px; cursor:pointer; text-align:left;
  }
  .track-head:hover { background:#1f2939; }
  .track-head .chev { flex-shrink:0; color:var(--muted); font-size:10px; width:12px;
    display:inline-block; transition:transform .2s ease; }
  .track.open .track-head .chev { transform:rotate(90deg); color:var(--track-color); }
  .track-head .tname { font-size:14px; font-weight:600; flex:1; }
  .track-head .tprog { display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .track-head .mini { width:64px; height:5px; background:#0f151d; border-radius:99px; overflow:hidden; }
  .track-head .mini > span { display:block; height:100%; background:var(--track-color); border-radius:99px; transition:width .3s ease; }
  .track-head .cnt { font-size:11px; color:var(--muted); min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }

  /* Accordion body — animated via grid-template-rows */
  .track-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s ease; }
  .track.open .track-body { grid-template-rows:1fr; }
  .track-body > .inner { overflow:hidden; }
  .body-pad { padding:2px 16px 12px 30px; }
  .track-actions { display:flex; justify-content:flex-end; margin-bottom:2px; }
  .reset-btn { font-size:11px; color:var(--muted); background:none; border:1px solid var(--card-border);
    border-radius:6px; padding:3px 9px; cursor:pointer; }
  .reset-btn:hover { color:var(--text); border-color:var(--line); }

  /* Task rows */
  .task-row { padding:8px 0; border-bottom:1px solid #232c3a; }
  .task-row:last-child { border-bottom:none; }
  .task-main { display:flex; align-items:flex-start; gap:11px; }
  .task-row input[type=checkbox] { margin-top:1px; width:17px; height:17px;
    accent-color:var(--track-color, #4da8ff); cursor:pointer; flex-shrink:0; }
  .task-label { font-size:13px; line-height:1.45; flex:1; }
  .task-label.done { color:var(--muted); text-decoration:line-through; }
  .task-tag { font-size:9.5px; padding:1px 6px; border-radius:10px; margin-left:6px;
    border:1px solid var(--card-border); color:var(--muted); white-space:nowrap; }
  .note-toggle { flex-shrink:0; background:none; border:1px solid var(--card-border); color:var(--muted);
    border-radius:6px; font-size:11px; padding:2px 8px; cursor:pointer; line-height:1.5; }
  .note-toggle.has-note { color:var(--track-color); border-color:var(--track-color); }
  .note-toggle:hover { color:var(--text); }
  .note-box { margin:8px 0 0 28px; display:none; }
  .note-box.open { display:block; }
  .note-box textarea { width:100%; min-height:54px; resize:vertical; background:#0f151d; color:var(--text);
    border:1px solid var(--card-border); border-radius:6px; padding:8px; font-size:12.5px;
    font-family:inherit; line-height:1.4; }
  .note-box textarea:focus { outline:none; border-color:var(--track-color); }
  .note-saved { font-size:10px; color:var(--muted); margin-top:3px; opacity:0; transition:opacity .3s; }
  .note-saved.show { opacity:1; }

  /* Personal to-do list */
  .todos { background:var(--panel); border:1px solid var(--card-border);
    border-radius:14px; padding:16px 18px; margin:0 0 26px; }
  .todos-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .todos-head h2 { font-size:14px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .todos-head .date { color:var(--muted); font-size:12px; }
  .todos-head .open-cnt { margin-left:auto; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .todo-add { display:flex; gap:8px; margin-bottom:12px; }
  .todo-add input { flex:1; background:#0f151d; color:var(--text); border:1px solid var(--card-border);
    border-radius:8px; padding:9px 12px; font-size:13px; font-family:inherit; }
  .todo-add input:focus { outline:none; border-color:#4da8ff; }
  .todo-add button { background:#4da8ff; color:#08121f; border:none; border-radius:8px; padding:0 16px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .todo-add button:hover { background:#6fb8ff; }
  .todo-list { display:flex; flex-direction:column; }
  .todo-day { margin-top:4px; }
  .todo-day:first-child { margin-top:0; }
  .todo-day-head { display:flex; align-items:baseline; gap:8px; padding:9px 0 3px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .todo-day-head.today { color:#4da8ff; }
  .todo-day-cnt { font-weight:500; letter-spacing:0; text-transform:none; font-size:11px; color:var(--muted); }
  .todo-item { display:flex; align-items:flex-start; gap:11px; padding:7px 0; border-bottom:1px solid #232c3a; }
  .todo-day .todo-item:last-child { border-bottom:none; }
  .todo-item input[type=checkbox] { margin-top:1px; width:17px; height:17px; accent-color:#38c793; cursor:pointer; flex-shrink:0; }
  .todo-item .txt { flex:1; font-size:13px; line-height:1.45; word-break:break-word; }
  .todo-item.done .txt { color:var(--muted); text-decoration:line-through; }
  .todo-del { flex-shrink:0; background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:17px; line-height:1; padding:0 4px; border-radius:6px; }
  .todo-del:hover { color:#ff6b8a; background:#231820; }
  .todos-empty { color:var(--muted); font-size:12.5px; padding:6px 0; }
  .todos-foot { display:flex; justify-content:flex-end; margin-top:10px; }
  .clear-done { font-size:11px; color:var(--muted); background:none; border:1px solid var(--card-border);
    border-radius:6px; padding:3px 9px; cursor:pointer; }
  .clear-done:hover { color:var(--text); border-color:var(--line); }

  @media (max-width: 560px) {
    #app { padding:16px 12px; }
    .track-head .mini { width:46px; }
    .track-head .tname { font-size:13.5px; }
    .body-pad { padding-left:20px; }
  }
</style>

      if (hasClaudeStorage) {
        try { return await window.storage.set(key, value); }
        catch (e) { /* fall through to localStorage as backup */ }
      }
      try { localStorage.setItem(LS_PREFIX + key, value); return { key, value }; }
      catch (e) { return null; }
    }
  };

  function allTracks() {
    return DATA.flatMap(p => p.tracks.map(t => ({...t, phase:p.phase, weeks:p.weeks})));
  }

  async function loadState(track) {
    if (state[track.id]) return state[track.id];
    let s;
    try {
      const res = await storage.get('progress:' + track.id);
      s = res ? JSON.parse(res.value) : null;
    } catch (e) { s = null; }
    if (!s || !Array.isArray(s.done)) {
      s = { done: new Array(track.tasks.length).fill(false), notes: new Array(track.tasks.length).fill('') };
    }
    // backfill in case task count changed
    while (s.done.length < track.tasks.length) s.done.push(false);
    while (s.notes.length < track.tasks.length) s.notes.push('');
    state[track.id] = s;
    return s;
  }

  async function saveState(trackId, s) {
    state[trackId] = s;
    try { await storage.set('progress:' + trackId, JSON.stringify(s)); } catch(e) {}
    if (!applyingRemote) scheduleSync();
  }

  function countDone(arr) { return arr.filter(Boolean).length; }

  const saveTimers = {};

  function trackById(id) { return allTracks().find(t => t.id === id); }

  function renderTaskRow(tr, task, i, s) {
    const hasNote = !!(s.notes[i] && s.notes[i].trim());
    return `
      <div class="task-row">
        <div class="task-main">
          <input type="checkbox" ${s.done[i] ? 'checked' : ''} data-tid="${tr.id}" data-idx="${i}">
          <div class="task-label ${s.done[i] ? 'done' : ''}">${task.t}<span class="task-tag">${task.tag}</span></div>
          <button class="note-toggle ${hasNote ? 'has-note' : ''}" data-tid="${tr.id}" data-idx="${i}">${hasNote ? '📝 Note' : '+ Note'}</button>
        </div>
        <div class="note-box ${hasNote ? 'open' : ''}" data-note-box="${tr.id}-${i}">
          <textarea placeholder="Add a note for this task…" data-tid="${tr.id}" data-idx="${i}">${s.notes[i] || ''}</textarea>
          <div class="note-saved" data-saved="${tr.id}-${i}">Saved</div>
        </div>
      </div>`;
  }

  function renderTrack(tr) {
    const s = state[tr.id];
    const isOpen = expanded.has(tr.id);
    return `
      <div class="track ${isOpen ? 'open' : ''}" data-id="${tr.id}" style="--track-color:${tr.color}">
        <button class="track-head" data-toggle="${tr.id}" aria-expanded="${isOpen}">
          <span class="chev">▶</span>
          <span class="tname">${tr.name}</span>
          <span class="tprog">
            <span class="mini" data-mini="${tr.id}"><span style="width:0%"></span></span>
            <span class="cnt">0/${tr.tasks.length}</span>
          </span>
        </button>
        <div class="track-body">
          <div class="inner">
            <div class="body-pad">
              <div class="track-actions"><button class="reset-btn" data-reset="${tr.id}">Reset track</button></div>
              ${tr.tasks.map((task, i) => renderTaskRow(tr, task, i, s)).join('')}
            </div>
          </div>
        </div>
      </div>`;
  }

  function render() {
    const header = `
      <div class="hdr">
        <h1>Senior iOS Interview Prep — Roadmap</h1>
        <div class="sub">Tap any track to expand its checklist. Progress saves automatically.</div>
        <div class="overall">
          <div class="bar"><span id="overall-fill" style="width:0%"></span></div>
          <div class="lbl" id="overall-label">0 / 0 done</div>
        </div>
        <div class="chips">
          ${DATA.map((p, pi) => `
            <button class="chip" data-jump="${pi}">
              <span class="dot" style="background:${p.tracks[0] ? p.tracks[0].color : 'var(--line)'}"></span>
              ${p.phase}
              <span class="cc" data-chip-count="${pi}">0/0</span>
            </button>`).join('')}
        </div>
        <div class="data-actions">
          <button class="mini-btn" id="export-btn" title="Download a JSON backup of all progress, notes, and to-dos">⤓ Export backup</button>
          <button class="mini-btn" id="import-btn" title="Load a JSON backup from another device">⤒ Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
          <button class="mini-btn" id="sync-btn" title="Set up automatic sync across devices via a private GitHub Gist">☁ Sync</button>
          <span class="sync-status off" id="sync-status">Off</span>
        </div>
        <div class="sync-panel" id="sync-panel" ${syncPanelOpen ? '' : 'hidden'}>
          <div class="sync-row">
            <label for="sync-token">GitHub token (gist scope)</label>
            <input id="sync-token" type="password" autocomplete="off" placeholder="${sync.token ? '•••••••• saved on this device' : 'ghp_… (stored only in this browser)'}">
          </div>
          <div class="sync-row inline">
            <input id="sync-gist" type="text" autocomplete="off" placeholder="Gist ID (paste existing, or create one →)" value="${sync.gistId || ''}">
            <button class="mini-btn" id="sync-create">Create gist</button>
          </div>
          <div class="sync-actions">
            <button class="mini-btn" id="sync-connect">Connect &amp; pull</button>
            <button class="mini-btn" id="sync-now">Sync now</button>
            <button class="mini-btn" id="sync-disconnect">Disconnect</button>
          </div>
          <div class="sync-help">
            Your token is saved <b>only in this browser</b> — never in the page, the gist, or your export file. It syncs to a <b>private</b> gist.<br>
            Create one at <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a> → "Tokens (classic)" → check only the <code>gist</code> scope. Then on each device: paste the token, and use the <b>same</b> Gist ID.
          </div>
        </div>
      </div>`;

    const todoDate = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const todoPanel = `
      <div class="todos">
        <div class="todos-head">
          <h2>Personal To-Dos</h2>
          <span class="date">${todoDate}</span>
          <span class="open-cnt" id="todo-open">0 open</span>
        </div>
        <form class="todo-add" id="todo-form">
          <input id="todo-input" type="text" placeholder="Add a personal task (project, errand, idea)…" autocomplete="off">
          <button type="submit">Add</button>
        </form>
        <div class="todo-list" id="todo-list"></div>
        <div class="todos-foot"><button class="clear-done" id="todo-clear">Clear completed</button></div>
      </div>`;

    const phases = DATA.map((phase, pi) => `
      <section class="phase" id="phase-${pi}">
        <div class="phase-bar">
          <h2>${phase.phase}</h2>
          <span class="wk">${phase.weeks}</span>
          <span class="pc" data-phase-count="${pi}">0/0</span>
        </div>
        <div class="phase-line"></div>
        ${phase.tracks.map(tr => renderTrack(tr)).join('')}
      </section>`).join('');

    root.innerHTML = `<div class="wrap">${header}${todoPanel}${phases}</div>`;
    attachListeners();
    renderTodos();
    refreshProgress();
  }

  function refreshProgress() {
    let allDone = 0, allTotal = 0;
    DATA.forEach((phase, pi) => {
      let pd = 0, pt = 0;
      phase.tracks.forEach(tr => {
        const s = state[tr.id];
        const d = countDone(s.done), t = tr.tasks.length;
        pd += d; pt += t;
        const mini = root.querySelector(`[data-mini="${tr.id}"]`);
        if (mini) {
          mini.firstElementChild.style.width = (t ? d / t * 100 : 0) + '%';
          const cnt = mini.parentElement.querySelector('.cnt');
          if (cnt) cnt.textContent = `${d}/${t}`;
        }
      });
      allDone += pd; allTotal += pt;
      const pc = root.querySelector(`[data-phase-count="${pi}"]`); if (pc) pc.textContent = `${pd}/${pt}`;
      const cc = root.querySelector(`[data-chip-count="${pi}"]`); if (cc) cc.textContent = `${pd}/${pt}`;
    });
    const of = root.querySelector('#overall-fill'); if (of) of.style.width = (allTotal ? allDone / allTotal * 100 : 0) + '%';
    const ol = root.querySelector('#overall-label'); if (ol) ol.textContent = `${allDone} / ${allTotal} done`;
  }

  function attachListeners() {
    // Expand / collapse a track
    root.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-toggle');
        const track = btn.closest('.track');
        const nowOpen = track.classList.toggle('open');
        btn.setAttribute('aria-expanded', nowOpen);
        if (nowOpen) expanded.add(id); else expanded.delete(id);
      });
    });

    // Quick-jump chips
    root.querySelectorAll('[data-jump]').forEach(chip => {
      chip.addEventListener('click', () => {
        const el = document.getElementById('phase-' + chip.getAttribute('data-jump'));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Checkboxes
    root.querySelectorAll('.task-row input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id = cb.getAttribute('data-tid');
        const idx = parseInt(cb.getAttribute('data-idx'));
        const s = state[id];
        s.done[idx] = cb.checked;
        cb.nextElementSibling.classList.toggle('done', cb.checked);
        refreshProgress();
        await saveState(id, s);
      });
    });

    // Note toggles
    root.querySelectorAll('.note-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-tid');
        const idx = btn.getAttribute('data-idx');
        const box = root.querySelector(`[data-note-box="${id}-${idx}"]`);
        box.classList.toggle('open');
        if (box.classList.contains('open')) box.querySelector('textarea').focus();
      });
    });

    // Note textareas (debounced autosave)
    root.querySelectorAll('.note-box textarea').forEach(ta => {
      ta.addEventListener('input', () => {
        const id = ta.getAttribute('data-tid');
        const idx = parseInt(ta.getAttribute('data-idx'));
        const s = state[id];
        s.notes[idx] = ta.value;
        const btn = root.querySelector(`.note-toggle[data-tid="${id}"][data-idx="${idx}"]`);
        btn.classList.toggle('has-note', !!ta.value.trim());
        btn.textContent = ta.value.trim() ? '📝 Note' : '+ Note';
        const key = id + '-' + idx;
        clearTimeout(saveTimers[key]);
        saveTimers[key] = setTimeout(async () => {
          await saveState(id, s);
          const savedEl = root.querySelector(`[data-saved="${id}-${idx}"]`);
          if (savedEl) { savedEl.classList.add('show'); setTimeout(() => savedEl.classList.remove('show'), 1200); }
        }, 500);
      });
    });

    // Per-track reset
    root.querySelectorAll('[data-reset]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-reset');
        const tr = trackById(id);
        await saveState(id, { done: new Array(tr.tasks.length).fill(false), notes: new Array(tr.tasks.length).fill('') });
        render(); // rebuild; expanded set keeps this track open
      });
    });

    // Personal to-dos: add + clear completed
    const form = root.querySelector('#todo-form');
    if (form) form.addEventListener('submit', (e) => { e.preventDefault(); addTodo(); });
    const clr = root.querySelector('#todo-clear');
    if (clr) clr.addEventListener('click', async () => {
      todos = todos.filter(t => !t.done);
      await saveTodos();
      renderTodos();
    });

    // Data backup: export / import
    const exportBtn = root.querySelector('#export-btn');
    if (exportBtn) exportBtn.addEventListener('click', exportData);
    const importBtn = root.querySelector('#import-btn');
    const importFile = root.querySelector('#import-file');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { importData(reader.result); importFile.value = ''; };
        reader.readAsText(file);
      });
    }

    // Cloud sync
    const syncBtn = root.querySelector('#sync-btn');
    const syncPanel = root.querySelector('#sync-panel');
    if (syncBtn && syncPanel) syncBtn.addEventListener('click', () => {
      syncPanelOpen = !syncPanelOpen;
      syncPanel.hidden = !syncPanelOpen;
    });
    const createBtn = root.querySelector('#sync-create');
    if (createBtn) createBtn.addEventListener('click', async () => {
      const tok = root.querySelector('#sync-token').value.trim() || sync.token;
      if (!tok) { window.alert('Enter your GitHub token first.'); return; }
      setSyncStatus('syncing');
      try {
        const id = await createGist(tok);
        sync.token = tok; sync.gistId = id; sync.lastSynced = Date.now();
        await saveSyncConfig();
        const g = root.querySelector('#sync-gist'); if (g) g.value = id;
        setSyncStatus('ok');
        window.alert('Created a private sync gist. On your OTHER devices, paste this same Gist ID:\n\n' + id);
      } catch (e) { setSyncStatus('error', e.message); window.alert('Could not create gist: ' + e.message + '\n(Check the token has the "gist" scope.)'); }
    });
    const connectBtn = root.querySelector('#sync-connect');
    if (connectBtn) connectBtn.addEventListener('click', async () => {
      const tok = root.querySelector('#sync-token').value.trim() || sync.token;
      const gid = root.querySelector('#sync-gist').value.trim();
      if (!tok || !gid) { window.alert('Enter both a GitHub token and a Gist ID (or click "Create gist").'); return; }
      sync.token = tok; sync.gistId = gid;
      await saveSyncConfig();
      await pullFromGist();
    });
    const nowBtn = root.querySelector('#sync-now');
    if (nowBtn) nowBtn.addEventListener('click', () => {
      if (!syncEnabled()) { window.alert('Connect a token and Gist ID first.'); return; }
      pushToGist();
    });
    const discBtn = root.querySelector('#sync-disconnect');
    if (discBtn) discBtn.addEventListener('click', async () => {
      sync = { token: '', gistId: '', lastSynced: 0, status: 'off', statusMsg: '' };
      await saveSyncConfig();
      render();
    });

    renderSyncStatus();
  }

  // ---- Personal to-dos ----
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function loadTodos() {
    try {
      const res = await storage.get('todos:general');
      const arr = res ? JSON.parse(res.value) : null;
      todos = Array.isArray(arr) ? arr : [];
      todos.forEach(t => { if (!t.ts) t.ts = Date.now(); }); // backfill for grouping
    } catch (e) { todos = []; }
  }

  async function saveTodos() {
    try { await storage.set('todos:general', JSON.stringify(todos)); } catch (e) {}
    if (!applyingRemote) scheduleSync();
  }

  async function addTodo() {
    const input = root.querySelector('#todo-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text, done: false, ts: Date.now() });
    input.value = '';
    input.focus();
    await saveTodos();
    renderTodos();
  }

  function dayInfo(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    let label;
    if (sameDay(d, today)) label = 'Today';
    else if (sameDay(d, yest)) label = 'Yesterday';
    else label = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return {
      key: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(),
      label,
      isToday: sameDay(d, today),
      sortVal: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(),
    };
  }

  function todoItemHtml(t) {
    return `
      <div class="todo-item ${t.done ? 'done' : ''}" data-todo="${t.id}">
        <input type="checkbox" ${t.done ? 'checked' : ''} data-todo-check="${t.id}">
        <span class="txt">${esc(t.text)}</span>
        <button class="todo-del" data-todo-del="${t.id}" title="Delete" aria-label="Delete task">×</button>
      </div>`;
  }

  function renderTodos() {
    const list = root.querySelector('#todo-list');
    if (!list) return;
    const open = todos.filter(t => !t.done).length;
    const openEl = root.querySelector('#todo-open');
    if (openEl) openEl.textContent = todos.length ? `${open} open · ${todos.length} total` : '0 open';
    const clr = root.querySelector('#todo-clear');
    if (clr) clr.style.display = todos.some(t => t.done) ? '' : 'none';

    if (!todos.length) {
      list.innerHTML = `<div class="todos-empty">Nothing here yet — add your first task above.</div>`;
      return;
    }
    // Group by calendar day, newest day first; within a day, open items before done.
    const groups = {};
    todos.forEach(t => {
      const info = dayInfo(t.ts);
      (groups[info.key] = groups[info.key] || { info, items: [] }).items.push(t);
    });
    const orderedGroups = Object.values(groups).sort((a, b) => b.info.sortVal - a.info.sortVal);
    orderedGroups.forEach(g => g.items.sort((a, b) => a.done === b.done ? a.ts - b.ts : (a.done ? 1 : -1)));

    list.innerHTML = orderedGroups.map(g => {
      const openInDay = g.items.filter(x => !x.done).length;
      return `
        <div class="todo-day">
          <div class="todo-day-head ${g.info.isToday ? 'today' : ''}">${g.info.label}<span class="todo-day-cnt">${openInDay} open</span></div>
          ${g.items.map(todoItemHtml).join('')}
        </div>`;
    }).join('');

    list.querySelectorAll('[data-todo-check]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id = cb.getAttribute('data-todo-check');
        const t = todos.find(x => String(x.id) === id);
        if (t) { t.done = cb.checked; await saveTodos(); renderTodos(); }
      });
    });
    list.querySelectorAll('[data-todo-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-todo-del');
        todos = todos.filter(x => String(x.id) !== id);
        await saveTodos();
        renderTodos();
      });
    });
  }

  // ---- Backup: export / import all data ----
  function exportData() {
    const payload = {
      app: 'ios-interview-roadmap',
      version: 1,
      exportedAt: new Date().toISOString(),
      progress: state,   // { [trackId]: { done:[], notes:[] } }
      todos: todos,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ios-prep-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Write a { progress, todos } payload into local state (from an import file or a gist
  // pull). Guarded so it never triggers a push back to the cloud.
  async function applyPayload(data) {
    applyingRemote = true;
    try {
      if (data.progress && typeof data.progress === 'object') {
        for (const [id, blob] of Object.entries(data.progress)) {
          if (blob && Array.isArray(blob.done)) {
            await saveState(id, { done: blob.done, notes: Array.isArray(blob.notes) ? blob.notes : [] });
          }
        }
      }
      if (Array.isArray(data.todos)) {
        todos = data.todos.map(t => ({
          id: t.id || (Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
          text: String(t.text || ''),
          done: !!t.done,
          ts: t.ts || Date.now(),
        }));
        await saveTodos();
      }
    } finally {
      applyingRemote = false;
    }
    render();
  }

  async function importData(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { window.alert('Import failed: that file isn’t valid JSON.'); return; }
    if (!data || typeof data !== 'object' || (!data.progress && !data.todos)) {
      window.alert('Import failed: this doesn’t look like a roadmap backup file.');
      return;
    }
    if (!window.confirm('Import will overwrite the progress, notes, and to-dos on THIS device with the backup’s contents. Continue?')) return;
    await applyPayload(data);
    window.alert('Import complete — your data has been restored on this device.');
  }

  // ---- Cloud sync (private GitHub Gist; token stays in this browser only) ----
  function syncEnabled() { return !!(sync.token && sync.gistId); }

  async function loadSyncConfig() {
    try {
      const res = await storage.get('sync:config');
      const c = res ? JSON.parse(res.value) : null;
      if (c && typeof c === 'object') sync = Object.assign(sync, { token: c.token || '', gistId: c.gistId || '', lastSynced: c.lastSynced || 0 });
    } catch (e) {}
    sync.status = syncEnabled() ? 'ok' : 'off';
  }
  async function saveSyncConfig() {
    try { await storage.set('sync:config', JSON.stringify({ token: sync.token, gistId: sync.gistId, lastSynced: sync.lastSynced })); } catch (e) {}
  }

  function buildPayload() {
    return { app: 'ios-interview-roadmap', version: 1, updatedAt: Date.now(), progress: state, todos: todos };
  }
  function ghHeaders(tok) {
    return { 'Authorization': 'Bearer ' + (tok || sync.token), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  }
  const GIST_FILE = 'roadmap-data.json';

  function scheduleSync() {
    if (!syncEnabled()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { pushToGist(); }, 1500);
  }

  async function pullFromGist() {
    if (!syncEnabled()) return;
    setSyncStatus('syncing');
    try {
      const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(sync.gistId), { headers: ghHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const gist = await res.json();
      const file = gist.files && gist.files[GIST_FILE];
      if (file && file.content) {
        let data = null;
        try { data = JSON.parse(file.content); } catch (e) {}
        if (data) await applyPayload(data);
      }
      sync.lastSynced = Date.now();
      await saveSyncConfig();
      setSyncStatus('ok');
    } catch (e) { setSyncStatus('error', e.message); }
  }

  async function pushToGist() {
    if (!syncEnabled()) return;
    setSyncStatus('syncing');
    try {
      const payload = buildPayload();
      const res = await fetch('https://api.github.com/gists/' + encodeURIComponent(sync.gistId), {
        method: 'PATCH', headers: ghHeaders(),
        body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(payload) } } }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      sync.lastSynced = payload.updatedAt;
      await saveSyncConfig();
      setSyncStatus('ok');
    } catch (e) { setSyncStatus('error', e.message); }
  }

  async function createGist(tok) {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: ghHeaders(tok),
      body: JSON.stringify({ description: 'iOS Interview Prep Roadmap — sync data (do not share)', public: false, files: { [GIST_FILE]: { content: JSON.stringify(buildPayload()) } } }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const gist = await res.json();
    return gist.id;
  }

  function relTime(ts) {
    if (!ts) return '';
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    const m = Math.round(s / 60); if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }
  function setSyncStatus(kind, msg) { sync.status = kind; sync.statusMsg = msg || ''; renderSyncStatus(); }
  function renderSyncStatus() {
    const el = root.querySelector('#sync-status');
    if (!el) return;
    if (!syncEnabled()) { el.textContent = 'Off'; el.className = 'sync-status off'; el.title = ''; return; }
    if (sync.status === 'syncing') { el.textContent = 'Syncing…'; el.className = 'sync-status syncing'; el.title = ''; }
    else if (sync.status === 'error') { el.textContent = 'Sync error'; el.className = 'sync-status error'; el.title = sync.statusMsg || ''; }
    else { el.textContent = 'Synced ' + relTime(sync.lastSynced); el.className = 'sync-status ok'; el.title = ''; }
  }

  async function init() {
    await loadSyncConfig();
    await Promise.all([loadTodos(), ...allTracks().map(loadState)]);
    render();
    if (syncEnabled()) pullFromGist(); // download latest from the gist, then it renders
  }

  init();
})();
</script>
</body>
</html>
